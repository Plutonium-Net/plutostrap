name: Feature Request
description: Suggest an improvement for PlutoStrap
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.

        - Please check the [existing issues](https://github.com/Plutonium-Net/plutostrap/issues?q=is%3Aissue) first, as your idea may already have been raised.
        - Requests that depend on changing Roblox itself are limited by what Roblox exposes through Fast Flags and launch options.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in and what is currently inconvenient or missing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like PlutoStrap to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have tried.
    validations:
      required: false
