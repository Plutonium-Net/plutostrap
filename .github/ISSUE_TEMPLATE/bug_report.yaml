name: Bug Report
description: Report a problem with PlutoStrap
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        - Before you open this report, please make sure you are using the [latest release of PlutoStrap](https://github.com/Plutonium-Net/plutostrap/releases/latest).
        - Search the [existing issues](https://github.com/Plutonium-Net/plutostrap/issues?q=is%3Aissue) first, as the problem may already be known.
        - PlutoStrap is a third-party launcher. Problems with Roblox itself should be reported to Roblox.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem, including what you expected to happen.
      placeholder: When I launched Roblox, PlutoStrap...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can the problem be reproduced?
      placeholder: |
        1. Open PlutoStrap settings
        2. Enable ...
        3. Launch Roblox
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: PlutoStrap version
      description: Shown in the About window, or in Settings.
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the contents of the PlutoStrap log here, if you have one. This is filled in automatically when reporting from the exception dialog.
      render: text
    validations:
      required: false
